name: Retain latest Ruster builds
on:
  workflow_run:
    workflows: [Build Ruster App]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: ruster-artifact-retention
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Keep the two latest complete Windows and Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prune_artifacts.py --keep 2 --apply
