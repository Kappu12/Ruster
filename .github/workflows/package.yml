name: Release Rustmatics App
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ruster-release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.ref_name }}
jobs:
  tests:
    uses: ./.github/workflows/check.yml
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache@v5
        with:
          path: build/blender-*-linux-x64.tar.xz
          key: ruster-blender-linux-x64-${{ hashFiles('engine.lock.json') }}
      - name: Build and test Ubuntu release package
        run: python tools/package.py --archive --output-name "Rustmatics-linux-x64-${RELEASE_TAG}"
      - name: Upload Ubuntu package to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release.py prepare
          python tools/release.py upload --platform linux-x64
