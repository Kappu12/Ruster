name: Check Ruster
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest lz4 numpy -r requirements-assets.txt -r requirements-mcp.txt
      - run: python -m pytest -q
      - run: python -m compileall -q ruster tools bootstrap.py launch.py
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download verified Blender LTS
        run: python tools/fetch_engine.py /tmp/ruster-engine
      - run: python -m pip install -r requirements-mcp.txt
      - name: Test native prefab, import/export, materials and MCP integration
        run: python tools/native_checks.py --engine /tmp/ruster-engine --suite background
      - name: Test graphical startup, welcome, search, materials, construction and MCP
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export RUSTER_TEST_PYTHON="$(command -v python)"
          python tools/native_checks.py --engine /tmp/ruster-engine --suite graphical --xvfb
