name: Check Ruster
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ruster-check-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  formats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install pytest lz4 numpy -r requirements-assets.txt -r requirements-mcp.txt
      - run: python -m pytest -q tests
  package:
    # Tagged builds run the same package checks in the release workflow.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache@v5
        with:
          path: build/blender-*-linux-x64.tar.xz
          key: ruster-blender-linux-x64-${{ hashFiles('engine.lock.json') }}
      - name: Build and test Ubuntu package
        run: python tools/package.py --output-name Ruster-linux-x64-check
  graphical:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - uses: actions/cache/restore@v5
        with:
          path: build/blender-*-linux-x64.tar.xz
          key: ruster-blender-linux-x64-${{ hashFiles('engine.lock.json') }}
      - name: Unpack verified Blender LTS
        run: python tools/fetch_engine.py /tmp/ruster-engine
      - run: |
          python -m pip install --only-binary=:all: --no-binary=tpk_ar --target python_modules -r requirements-assets.txt -r requirements-mcp.txt
      - name: Test the graphical editor
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export RUSTER_TEST_PYTHON="$(command -v python)"
          python tools/native_checks.py --engine /tmp/ruster-engine --suite graphical --xvfb --shard "${{ matrix.shard }}"
